
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ObjectFinder | Admin Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0b1120;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 430px;
            padding: 40px;
            background: #151f32;
            border: 1px solid #334155;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .logo span {
            color: #3b82f6;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 30px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            background: #0b1120;
            border: 1px solid #475569;
            border-radius: 8px;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #3b82f6;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            color: #f87171;
            font-size: 13px;
        }

        .back-link {
            display: block;
            margin-top: 22px;
            text-align: center;
            color: #94a3b8;
            text-decoration: none;
        }

        .back-link:hover {
            color: #ef4444;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">
            Object<span>Finder</span>
        </div>

        <p class="subtitle">Administrator Control Panel</p>

        <h2>Admin Login</h2>

        <form id="adminLoginForm">

            <div class="form-group">
                <label for="adminName">Admin Name</label>
                <input
                    type="text"
                    id="adminName"
                    placeholder="Enter admin name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="adminEmail">Admin Email</label>
                <input
                    type="email"
                    id="adminEmail"
                    placeholder="Enter admin email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="adminCode">Admin Code</label>
                <input
                    type="password"
                    id="adminCode"
                    placeholder="Enter admin code"
                    required
                >
            </div>

            <button type="submit">Login as Admin</button>

            <p id="message" role="status"></p>

        </form>

        <a href="index.html" class="back-link">
            ← Back to Home
        </a>

    </div>

    <script src="admin.js"></script>

</body>
</html>
